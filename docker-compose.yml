---
version: '2.3'

services:
  bind:
    image: registry.shanemcc.net/mydnshost-public/bind:latest
    container_name: mydnshost_bind
    hostname: bind
    domainname: mydnshost.co.uk
    environment:
      - RUNMODE=SLAVE
    env_file:
      - ./data/server_settings.conf
    restart: always
    network_mode: host
    volumes:
      - ./data:/bind
      - ./data:/etc/bind/data
